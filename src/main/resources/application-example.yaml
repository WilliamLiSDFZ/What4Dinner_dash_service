server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: Your-Application-Name

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/database}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/your-private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/your-public.pem}
  expiration-minutes: 60

gcs:
  bucket: ${GCS_BUCKET:}
  credentials: ${GCS_CREDENTIALS:classpath:keys/gcp-key.json}
  signed-url-minutes: ${GCS_SIGNED_URL_MINUTES:15}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  max-images: ${ANTHROPIC_MAX_IMAGES:10}

share-import:
  timeout-seconds: ${SHARE_IMPORT_TIMEOUT_SECONDS:15}
  max-images: ${SHARE_IMPORT_MAX_IMAGES:10}
  max-image-bytes: ${SHARE_IMPORT_MAX_IMAGE_BYTES:8388608}

image-gen:
  provider: ${IMAGE_GEN_PROVIDER:openai}
  timeout-seconds: ${IMAGE_GEN_TIMEOUT_SECONDS:120}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
    size: ${OPENAI_IMAGE_SIZE:1024x1024}
    quality: ${OPENAI_IMAGE_QUALITY:medium}
    output-format: ${OPENAI_IMAGE_OUTPUT_FORMAT:png}
