services:
  app:
    build:
      context: .
      # Build steps use the host network so RUN can resolve DNS. Containers otherwise
      # inherit a resolv.conf whose only entry is the systemd-resolved loopback stub,
      # which Docker strips - leaving them with no resolver and Maven unable to reach
      # repo.maven.apache.org.
      network: host
    image: what4dinner-dash-service:latest
    container_name: what4dinner-dash-service
    ports:
      - "8082:8082"
    environment:
      # Passed through from the host if set; otherwise the application.yaml defaults apply.
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - GCS_BUCKET
      - GCS_CREDENTIALS
      - GCS_SIGNED_URL_MINUTES
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      # Redis runs outside compose - point REDIS_HOST at the host/server instance.
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      # JWT keys are baked into the image at classpath:keys/*.pem (see src/main/resources/keys).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
